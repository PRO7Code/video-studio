mediapipe:     {status: optional, license: Apache-2.0, size: "~10 MB", use: teacher background removal}
deepfilternet: {status: optional, license: MIT/Apache-2.0, size: "~100 MB + torch", use: voice denoise}
piper-tts:     {status: optional, license: MIT, size: "~60 MB/voice", use: Arabic draft voice-over}
real-esrgan:   {status: optional, license: BSD-3, size: "~65 MB", use: upscale (slow on CPU)}
avoid_commercial: [XTTS-v2 (CPML), F5-TTS weights (CC-BY-NC), MusicGen weights (CC-BY-NC)]
